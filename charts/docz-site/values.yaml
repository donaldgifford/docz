---
# yaml-language-server: $schema=values.schema.json

# -- Number of replicas
replicaCount: 1

# -- Number of old ReplicaSets retained for rollback. Defaults to 3 to
# keep the kubectl `get rs` view tidy; bump if you need more rollback
# headroom. Kubernetes default is 10.
revisionHistoryLimit: 3

image:
  # -- Container image repository
  repository: ghcr.io/donaldgifford/docz-site
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default: chart appVersion)
  tag: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Override the ServiceAccount name
  name: ""

# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}

# -- Pod security context. Defaults match the `oven/bun` runtime image,
# whose `bun` user is UID/GID 1000, and drop to a RuntimeDefault seccomp
# profile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context. The static server reads `dist/` and
# proxies; it writes nothing to disk, so the rootfs is mounted read-only.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  # -- Service type
  type: ClusterIP
  # -- Service port. Targets the container's single `http` port, which
  # serves the SPA, /healthz, and the same-origin API proxy.
  port: 80

# -- Container resource requests and limits
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# -- Liveness probe. Stays on /healthz, which is unconditional: a
# failing liveness probe RESTARTS the container, and restarting cannot
# fix a broken image or mount — that is just CrashLoopBackOff.
livenessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

# -- Readiness probe. Points at /readyz, which verifies the dist/ is
# servable and the runtime config validated — a failing readiness probe
# HOLDS TRAFFIC, so a bad deploy stalls the rollout and the previous
# ReplicaSet keeps serving. /readyz makes no call to docz-api by
# design: gating readiness on the API would evict every pod from the
# Service when the API blipped.
readinessProbe:
  # @default -- See values.yaml
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- docz-site runtime configuration. The site is a static SPA served by
# a small Bun process that also reverse-proxies the API surface, so the
# browser and API share one origin (no CORS, first-party session cookie).
config:
  # -- Container HTTP listen port (drives the PORT env var and the
  # Service targetPort). The SPA, /healthz, /readyz, and the API proxy
  # are all served here.
  port: 8080
  # -- Absolute base URL of the docz-api the site proxies to
  # (DOCZ_API_URL). In-cluster this is the docz-api Service, e.g.
  # http://docz-api:8080. Required — without it the API proxy returns
  # 502.
  doczApiUrl: ""
  # -- Comma-separated login providers to show on /login
  # (DOCZ_AUTH_PROVIDERS): github, okta, keycloak. The server injects
  # this into the SPA at runtime (whitelist-validated), so one image
  # serves any combo — no rebuild. Must match docz-api's own
  # AUTH_PROVIDERS. Empty/unknown → github. The GitHub App ingest
  # ("machine identity") is docz-api's and is independent of this.
  authProviders: "github"
  # -- Diagram layout engine (DOCZ_MERMAID_LAYOUT): `elk` or `dagre`.
  # mermaid 12 made ELK the default and so is it here; `dagre` restores
  # the pre-12 layout without rebuilding the image. Injected into the
  # SPA at runtime and whitelist-validated at both ends, so anything
  # unrecognized falls back to `elk` — the values schema constrains it
  # to the two names so a typo fails at install rather than silently
  # rendering the default.
  mermaidLayout: "elk"
  # -- Topbar nav pins (DOCZ_NAV_LINKS): a list of `{label, href}`
  # links rendered between Repos and the session menu. Injected into
  # the SPA at runtime as JSON, whitelist-validated by the server
  # (short label charset, same-origin app-path hrefs, cap 6); invalid
  # entries degrade to fewer/no pins, never a broken page. Empty →
  # no pins and the env var is omitted.
  navLinks: []
  # -- Log verbosity (DOCZ_LOG_LEVEL): `debug`, `info`, `warn`, or
  # `error`. `debug` adds a line per request plus the proxied `/auth/*`
  # flow — the level to reach for when troubleshooting an Okta or
  # Keycloak login. Credential-bearing values (`code`, `state`,
  # cookies) are redacted at every level, enforced by a test. The
  # values schema constrains this to the four names so a typo fails at
  # install; at runtime an unrecognized level falls back to `info`,
  # never to something noisier.
  logLevel: "info"
  # -- Log output format (DOCZ_LOG_FORMAT): `json` (one object per
  # line, for a log aggregator) or `text` (readable, for local runs).
  logFormat: "json"

metrics:
  # -- Expose Prometheus metrics on /metrics (DOCZ_METRICS_ENABLED).
  # When false the endpoint returns an explicit 404 rather than falling
  # through to the SPA — a scraper is told the endpoint is absent
  # instead of being handed index.html with a 200.
  enabled: true

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor scraping /metrics.
  # Requires `metrics.enabled`; the template is gated on both.
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for the ServiceMonitor (e.g. the `release`
  # label your Prometheus Operator selects on)
  labels: {}

otel:
  # -- OTLP/HTTP traces endpoint (OTEL_EXPORTER_OTLP_ENDPOINT), e.g.
  # http://otel-collector:4318/v1/traces. EMPTY MEANS TRACING IS OFF —
  # no provider is registered, no network call is attempted, and the
  # env var is omitted entirely. Only absolute http(s) URLs are
  # accepted; anything else is treated as unset rather than guessed at,
  # because this decides where request telemetry is sent.
  endpoint: ""
  # -- Service name reported to the collector (OTEL_SERVICE_NAME)
  serviceName: "docz-site"
  # -- Head sample rate (OTEL_TRACES_SAMPLER_ARG), clamped to 0..1.
  # docz-site injects `traceparent` on the proxy hop and docz-api
  # already extracts it, so a sampled request produces ONE trace
  # spanning both services with no docz-api configuration.
  sampleRate: 1

# -- Horizontal Pod Autoscaler. Off by default.
autoscaling:
  # -- Enable a HorizontalPodAutoscaler
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 3
  # -- Target average CPU utilization (percent)
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization (percent). Unset → no memory metric.
  targetMemoryUtilizationPercentage: 0

# -- Ingress (networking.k8s.io/v1). Off by default.
ingress:
  # -- Enable an Ingress
  enabled: false
  # -- IngressClass name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hosts. Each entry: {host, paths: [{path, pathType}]}.
  hosts: []
  # -- TLS blocks. Each entry: {secretName, hosts: []}.
  tls: []

# -- Gateway API HTTPRoute. Off by default.
httpRoute:
  # -- Enable an HTTPRoute
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- parentRefs (Gateways) this route attaches to.
  parentRefs: []
  # -- Hostnames matched by this route.
  hostnames: []
  # -- Route rules. Empty → the template renders a default rule to the
  # service.
  rules: []

# -- Additional environment variables
extraEnv: []
# -- Additional volumes
extraVolumes: []
# -- Additional volume mounts
extraVolumeMounts: []

# -- Node selector
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
