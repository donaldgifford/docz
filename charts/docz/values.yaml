---
# yaml-language-server: $schema=values.schema.json

# Values for the docz chart: docz-api, docz-site, and their backends in one
# release (DESIGN-0018). Five kinds of block:
#
#   extraLabels                      tracking labels on every resource
#   auth, otel, metrics,
#   serviceMonitor, prometheusRule   shared: set once, read by both workloads
#   api, site                        one block per workload, each with its
#                                    own ingress and httpRoute
#   store, queue, search             the API's backing services

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource-name prefix (`<release>-docz` by default).
fullnameOverride: ""
# -- Image pull secrets, shared by both workloads.
imagePullSecrets: []

# -- Labels added to every object's metadata and to every pod template, for
# tracking (e.g. `owner: lab`). Never added to a selector, a StatefulSet's
# volumeClaimTemplates, or CNPG's inheritedMetadata, so setting or changing
# them cannot break an install or an upgrade. A key the chart sets itself
# (`helm.sh/chart`, `app.kubernetes.io/*`) fails the render.
extraLabels: {}

auth:
  # -- Comma-separated login providers: `github`, `okta`, `keycloak`, or
  # `none` alone (login-free; the read API is open to anyone who can reach
  # it). Rendered as AUTH_PROVIDERS on the API and DOCZ_AUTH_PROVIDERS on
  # the site, so the two always agree.
  providers: "github"

otel:
  # -- OTLP/HTTP collector endpoint, host:port or URL
  # (OTEL_EXPORTER_OTLP_ENDPOINT). Empty → tracing off in both workloads.
  # Each workload names its own spans with `<workload>.otel.serviceName`.
  endpoint: ""
  # -- Trace sample rate 0.0–1.0 (OTEL_SAMPLE_RATE), for both workloads.
  sampleRate: 1

# -- Prometheus metrics, served on each workload's HTTP port.
metrics:
  # -- Expose /metrics on both workloads. Also turns on the baked
  # Meilisearch's Prometheus route (MEILI_EXPERIMENTAL_ENABLE_METRICS).
  enabled: true

serviceMonitor:
  # -- Create Prometheus Operator ServiceMonitors: one per workload, and in
  # baked mode one for Meilisearch with the master key as its bearer token.
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for every ServiceMonitor
  labels: {}

# -- PrometheusRule with the API's starter alerts (RED + ingest).
prometheusRule:
  # -- Create the PrometheusRule.
  enabled: false
  # -- Additional labels (e.g., to match Prometheus operator
  # `ruleSelector`).
  labels: {}

# -- docz-api: the server. Always installed.
api: {}

# -- docz-site: the frontend. Always installed.
site: {}
