---
# yaml-language-server: $schema=values.schema.json

# Values for the docz chart: docz-api, docz-site, and their backends in one
# release (DESIGN-0018). Five kinds of block:
#
#   extraLabels                      tracking labels on every resource
#   auth, otel, metrics,
#   serviceMonitor, prometheusRule   shared: set once, read by both workloads
#   api, site                        one block per workload, each with its
#                                    own ingress and httpRoute
#   store, queue, search             the API's backing services

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource-name prefix (`<release>-docz` by default).
fullnameOverride: ""
# -- Image pull secrets, shared by both workloads.
imagePullSecrets: []

# -- Labels added to every object's metadata and to every pod template, for
# tracking (e.g. `owner: lab`). Never added to a selector, a StatefulSet's
# volumeClaimTemplates, or CNPG's inheritedMetadata, so setting or changing
# them cannot break an install or an upgrade. A key the chart sets itself
# (`helm.sh/chart`, `app.kubernetes.io/*`) fails the render.
extraLabels: {}

auth:
  # -- Comma-separated login providers: `github`, `okta`, `keycloak`, or
  # `none` alone (login-free; the read API is open to anyone who can reach
  # it). Rendered as AUTH_PROVIDERS on the API and DOCZ_AUTH_PROVIDERS on
  # the site, so the two always agree.
  providers: "github"

otel:
  # -- OTLP/HTTP collector endpoint, host:port or URL
  # (OTEL_EXPORTER_OTLP_ENDPOINT). Empty → tracing off in both workloads.
  # Each workload names its own spans with `<workload>.otel.serviceName`.
  endpoint: ""
  # -- Trace sample rate 0.0–1.0 (OTEL_SAMPLE_RATE), for both workloads.
  sampleRate: 1

# -- Prometheus metrics, served on each workload's HTTP port.
metrics:
  # -- Expose /metrics on both workloads. Also turns on the baked
  # Meilisearch's Prometheus route (MEILI_EXPERIMENTAL_ENABLE_METRICS).
  enabled: true

serviceMonitor:
  # -- Create Prometheus Operator ServiceMonitors: one per workload, and in
  # baked mode one for Meilisearch with the master key as its bearer token.
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for every ServiceMonitor
  labels: {}

# -- PrometheusRule with the API's starter alerts (RED + ingest).
prometheusRule:
  # -- Create the PrometheusRule.
  enabled: false
  # -- Additional labels (e.g., to match Prometheus operator
  # `ruleSelector`).
  labels: {}

# -- docz-api: the server. Always installed.
api:
  # -- Number of replicas
  replicaCount: 1

  # -- Number of old ReplicaSets retained for rollback. Defaults to 3 to
  # keep the kubectl `get rs` view tidy; bump if you need more rollback
  # headroom. Kubernetes default is 10.
  revisionHistoryLimit: 3

  image:
    # -- Container image repository
    repository: ghcr.io/donaldgifford/docz-api
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Overrides the image tag (default: chart appVersion)
    tag: ""

  serviceAccount:
    # -- Create a ServiceAccount
    create: true
    # -- Annotations for the ServiceAccount
    annotations: {}
    # -- Override the ServiceAccount name
    name: ""

  # -- Pod annotations
  podAnnotations: {}

  # -- Pod labels
  podLabels: {}

  # -- Pod security context. Defaults match the distroless `nonroot`
  # image (UID/GID 65532) and drop to a RuntimeDefault seccomp profile.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context. The image runs on a read-only rootfs;
  # nothing is written to disk except the optional mounted private key.
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  service:
    # -- Service type
    type: ClusterIP
    # -- Service port. Targets the container's single `http` port, which
    # serves the API, probes, and /metrics.
    port: 80

  # -- Container resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  livenessProbe:
    # @default -- See values.yaml
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15

  readinessProbe:
    # @default -- See values.yaml
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # -- docz-api application configuration (non-secret env vars). Empty
  # strings for the optional tuning knobs mean "emit nothing; let the
  # binary apply its own default".
  config:
    # -- GitHub App ID (GITHUB_APP_ID)
    appId: ""
    # -- Container HTTP listen port (drives HTTP_ADDR and the Service
    # targetPort). Everything — API, /healthz, /readyz, /metrics — is
    # served here.
    port: 8080
    # -- Log level: debug, info, warn, error (LOG_LEVEL)
    logLevel: "info"
    # -- Log format: text or json (LOG_FORMAT)
    logFormat: "json"
    # -- Absolute base URL the OAuth/OIDC provider redirects back to;
    # the chart appends /auth/callback (AUTH_REDIRECT_BASE). Required
    # unless auth.providers is "none". This is the **site's** public URL: the
    # site proxies /auth/callback to the API.
    authRedirectBase: ""
    # -- GitHub OAuth client id for site login (GITHUB_OAUTH_CLIENT_ID).
    # Required while `github` is in auth.providers.
    githubOAuthClientID: ""
    # -- Okta OIDC issuer, copied verbatim from the issuer's own
    # `.well-known/openid-configuration` (OKTA_ISSUER). Discovery runs at
    # startup, so a wrong value fails the boot. Required while `okta` is in
    # auth.providers. e.g. `https://acme.okta.com/oauth2/default`
    oktaIssuer: ""
    # -- Okta client id (OKTA_CLIENT_ID). The Okta app must be an OIDC **Web
    # Application** (confidential client, authorization-code flow) — an SPA or
    # Native app has no client secret and cannot complete the exchange.
    # Required while `okta` is in auth.providers.
    oktaClientID: ""
    # -- Comma-separated OAuth scopes Okta is asked for beyond `openid`, which
    # is always sent (OKTA_SCOPES). Empty → `profile,email`. Only add a scope
    # the Okta app is actually assigned: an unassigned scope fails the whole
    # authorize request with `invalid_scope`, so login breaks entirely rather
    # than degrading. Add `groups` only if the authorization server publishes
    # a groups claim — docz-api serves it on `/api/v1/auth/session` for the
    # site to read, but makes no access decision with it. Prefer setting this
    # in a values file: `--set` splits on commas, so it needs
    # `--set-string 'api.config.oktaScopes=profile\,email'`.
    oktaScopes: ""
    # -- Keycloak OIDC issuer, e.g.
    # `https://kc.example.com/realms/docz-api` (KEYCLOAK_ISSUER). Required
    # while `keycloak` is in auth.providers.
    keycloakIssuer: ""
    # -- Keycloak client id (KEYCLOAK_CLIENT_ID). The client must be
    # confidential (client authentication on). Required while `keycloak` is
    # in auth.providers.
    keycloakClientID: ""
    # -- Comma-separated OAuth scopes Keycloak is asked for beyond `openid`,
    # which is always sent (KEYCLOAK_SCOPES). Empty → `profile,email`. Only
    # add a scope assigned to the client (default or optional client scope):
    # an unassigned scope fails the authorize request with `invalid_scope`.
    # Stock Keycloak has no `groups` client scope — add one with a group
    # membership mapper before requesting it here.
    keycloakScopes: ""
    # -- GitHub API base URL; override for GitHub Enterprise
    # (GITHUB_API_BASE). Empty → api.github.com.
    githubApiBase: ""
    # -- Session lifetime as a Go duration (SESSION_TTL). Empty → 720h.
    sessionTTL: ""
    # -- Ingest debounce window as a Go duration (INGEST_DEBOUNCE).
    # Empty → 5s.
    ingestDebounce: ""

  # -- Tracing for the API. The endpoint and sample rate are the shared
  # top-level `otel` block.
  otel:
    # -- Service name reported on spans (OTEL_SERVICE_NAME).
    serviceName: "docz-api"

  # -- Application secrets. When `create` is true the chart renders a Secret
  # from the plaintext values below. When `create` is false, `existingSecret`
  # names a Secret you supply by any means (1Password Operator,
  # External Secrets, sealed-secrets, `kubectl create secret`, ...) — the
  # chart only references it by key, so the provider is entirely your choice.
  #
  # The referenced Secret must carry these keys:
  #
  #   app-id                  always
  #   webhook-secret          always
  #   session-secret          unless auth.providers is "none"
  #   private-key             when secrets.privateKeyAsFile is true, or the
  #                           GitHub App key is not supplied out-of-band
  #   oauth-client-secret     when `github`   is in auth.providers
  #   okta-client-secret      when `okta`     is in auth.providers
  #   keycloak-client-secret  when `keycloak` is in auth.providers
  #
  # Only the enabled providers' keys are referenced, so a github-only
  # install needs no okta-client-secret, and a "none" install needs no
  # login keys at all.
  secrets:
    # -- Create secret resource (false = use existing secret)
    create: true
    # -- Name of an existing Secret holding the keys listed above (when
    # create=false). Populate it with whatever secret manager you run.
    existingSecret: ""
    # -- GitHub webhook HMAC secret (GITHUB_WEBHOOK_SECRET)
    webhookSecret: ""
    # -- GitHub App private key (PEM format, GITHUB_APP_PRIVATE_KEY)
    privateKey: ""
    # -- Mount the private key as a file (true) or pass it as an env var
    # (false). Either way the binary accepts a path or a PEM body.
    privateKeyAsFile: true
    # -- Session signing secret (SESSION_SECRET). Required unless
    # auth.providers is "none".
    sessionSecret: ""
    # -- GitHub OAuth client secret for site login
    # (GITHUB_OAUTH_CLIENT_SECRET). Required while `github` is in
    # auth.providers and create=true. Secret key: oauth-client-secret.
    oauthClientSecret: ""
    # -- Okta client secret (OKTA_CLIENT_SECRET). Required while `okta` is
    # in auth.providers and create=true. Secret key:
    # okta-client-secret.
    oktaClientSecret: ""
    # -- Keycloak client secret (KEYCLOAK_CLIENT_SECRET). Required while
    # `keycloak` is in auth.providers and create=true. Secret key:
    # keycloak-client-secret.
    keycloakClientSecret: ""

  # -- Horizontal Pod Autoscaler. Off by default.
  autoscaling:
    # -- Enable a HorizontalPodAutoscaler
    enabled: false
    # -- Minimum replicas
    minReplicas: 1
    # -- Maximum replicas
    maxReplicas: 3
    # -- Target average CPU utilization (percent)
    targetCPUUtilizationPercentage: 80
    # -- Target average memory utilization (percent). Unset → no memory metric.
    targetMemoryUtilizationPercentage: 0

  # -- Additional environment variables
  extraEnv: []

  # -- Additional volumes
  extraVolumes: []

  # -- Additional volume mounts
  extraVolumeMounts: []

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

# -- docz-site: the frontend. Always installed.
site: {}

# -- Persistent state store (Postgres). See DESIGN-0012 §Backend modes.
store:
  # -- Backend implementation. Only "postgres" is supported.
  backend: postgres
  # -- Postgres-specific configuration. Ignored when backend != postgres.
  postgres:
    # -- Source of the Postgres deployment. One of:
    # "baked"    — chart renders a single-pod Postgres Deployment;
    # "cnpg"     — chart renders a CloudNativePG `Cluster` CR;
    # "external" — operator provides DATABASE_URL via store.external.
    mode: baked
    # -- Connection cap for the pgx pool.
    maxConns: 16
    # -- Baked Postgres-only configuration.
    baked:
      # -- Pinned image. Bump intentionally.
      image: postgres:18.4
      # -- Persistent volume size.
      storageSize: 10Gi
      # -- StorageClass name. Empty → cluster default.
      storageClassName: ""
      # -- Resource requests/limits for the Postgres container.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    # -- CloudNativePG-only configuration.
    cnpg:
      # -- Number of CNPG instances.
      instances: 1
      # -- CNPG-managed Postgres image.
      imageName: ghcr.io/cloudnative-pg/postgresql:18.4
      # -- Storage block.
      storage:
        size: 10Gi
        storageClass: ""
      # -- Connection pooler (PgBouncer). Disabled by default.
      pooler:
        enabled: false
        # -- Pooler type: `rw` (primary) or `ro` (read-only replicas).
        type: rw
        # -- Pooler replica count.
        instances: 1
        pgbouncer:
          # -- PgBouncer pool mode: `session`, `transaction`, or `statement`.
          poolMode: transaction
          # -- PgBouncer `default_pool_size`.
          defaultPoolSize: 25
          # -- PgBouncer `max_client_conn`.
          maxClientConnections: 100
          # -- Extra `pgbouncer.ini` parameters (key-value pairs).
          parameters: {}
        monitoring:
          # -- Render a `PodMonitor` for the pooler. Requires the Prometheus Operator CRD.
          enablePodMonitor: false
        # Cilium does not support TCPRoute (cilium/cilium#42016), so external
        # connections use a LoadBalancer Service with BGP advertisement.
        service:
          # -- Enable an external LoadBalancer Service in front of the pooler.
          enabled: false
          # -- Service `type` (usually `LoadBalancer`).
          type: LoadBalancer
          # -- Extra Service annotations.
          annotations: {}
          # -- Service labels. Defaults wire Cilium BGP IP advertisement.
          labels:
            bgp.cilium.io/advertise-service: default
            bgp.cilium.io/ip-pool: default
  # -- External Postgres. Used only when store.postgres.mode=external.
  external:
    # -- Operator-supplied secret holding the DATABASE_URL DSN. Required
    # when store.postgres.mode=external.
    existingSecret: ""
    # -- Key inside existingSecret holding the DSN. Default: DATABASE_URL.
    secretKey: DATABASE_URL

# -- Work queue + session store (Valkey, Redis-wire-compatible).
queue:
  # -- Backend implementation. Only "valkey" is supported.
  backend: valkey
  # -- Valkey-specific configuration. Ignored when backend != valkey.
  valkey:
    # -- Source of the Valkey deployment. One of:
    # "baked"    — chart renders a single-pod Valkey Deployment;
    # "external" — operator provides REDIS_URL via queue.external.
    mode: baked
    # -- Baked Valkey-only configuration.
    baked:
      # -- Pinned image. Bump intentionally.
      image: valkey/valkey:9.1
      # -- Persistent volume size.
      storageSize: 1Gi
      # -- StorageClass name. Empty → cluster default.
      storageClassName: ""
      # -- Generated AUTH password length (random alphanumeric). Only used
      # when existingSecret is unset.
      authPasswordLength: 32
    # -- Existing Secret holding the baked Valkey password. RECOMMENDED
    # under GitOps: the self-generated password above relies on Helm
    # `lookup`, which Argo CD / `helm template` cannot run, so it changes
    # on every render and the running server drifts from its clients
    # (asynq: WRONGPASS). Point this at a stable Secret (e.g. 1Password)
    # and the chart renders no Valkey Secret of its own — the baked Valkey
    # uses the value as `requirepass` and docz-api builds REDIS_URL from it
    # (injected via the container's VALKEY_PASSWORD env, so no plaintext DSN
    # is stored). Ignored when mode=external (use queue.external instead).
    existingSecret: ""
    # -- Key inside existingSecret holding the raw password. It is
    # interpolated into the redis:// DSN, so keep it URL-safe / alphanumeric
    # (e.g. `openssl rand -hex 32`).
    existingSecretKey: VALKEY_PASSWORD
  # -- External Valkey/Redis. Used only when queue.valkey.mode=external.
  external:
    # -- Operator-supplied secret holding the REDIS_URL DSN. Required
    # when queue.valkey.mode=external.
    existingSecret: ""
    # -- Key inside existingSecret holding the DSN. Default: REDIS_URL.
    secretKey: REDIS_URL

# -- Full-text search (Meilisearch). The chart runs a baked single-pod
# Meilisearch by default; point at an external instance with mode=external.
search:
  meili:
    # -- Source of Meilisearch. One of "baked" or "external".
    mode: baked
    # -- Meilisearch master key (baked mode). Required unless
    # existingSecret is set; shared by the baked Meilisearch
    # (MEILI_MASTER_KEY) and docz-api (MEILI_API_KEY). Prefer
    # existingSecret over an inline value to avoid a plaintext secret.
    masterKey: ""
    # -- Existing Secret holding the baked Meilisearch master key. When
    # set, the chart renders no Secret of its own and both baked
    # Meilisearch and docz-api read the key from here — no plaintext
    # masterKey in values. Ignored when mode=external (use
    # search.meili.external instead).
    existingSecret: ""
    # -- Key inside existingSecret holding the master key.
    existingSecretKey: MEILI_API_KEY
    # -- Pinned baked image. Bump intentionally.
    image: getmeili/meilisearch:v1.12
    # -- Persistent volume size (baked mode).
    storage: 5Gi
    # -- StorageClass name (baked mode). Empty → cluster default.
    storageClassName: ""
    # -- External Meilisearch base URL, http(s)://host:port. Required
    # when mode=external.
    host: ""
    # -- External Meilisearch secret. Used only when mode=external.
    external:
      # -- Secret holding the API key. Required when mode=external.
      existingSecret: ""
      # -- Key inside existingSecret holding the API key.
      secretKey: MEILI_API_KEY
