{{- if .Values.site.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "docz.serviceAccountName" (dict "ctx" . "component" "site") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docz.labels" (dict "ctx" . "component" "site") | nindent 4 }}
  {{- with .Values.site.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
