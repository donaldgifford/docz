{{- $providers := include "docz.api.authProviders" . | fromJsonArray -}}
{{- if .Values.api.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docz.componentFullname" (dict "ctx" . "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docz.labels" (dict "ctx" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  app-id: {{ required "api.config.appId is required" .Values.api.config.appId | quote }}
  webhook-secret: {{ required "api.secrets.webhookSecret is required" .Values.api.secrets.webhookSecret | quote }}
  {{- if not (include "docz.api.authDisabled" .) }}
  session-secret: {{ required "api.secrets.sessionSecret is required" .Values.api.secrets.sessionSecret | quote }}
  {{- end }}
  {{- if has "github" $providers }}
  oauth-client-secret: {{ required "api.secrets.oauthClientSecret is required when github is in auth.providers" .Values.api.secrets.oauthClientSecret | quote }}
  {{- end }}
  {{- if has "okta" $providers }}
  okta-client-secret: {{ required "api.secrets.oktaClientSecret is required when okta is in auth.providers" .Values.api.secrets.oktaClientSecret | quote }}
  {{- end }}
  {{- if has "keycloak" $providers }}
  keycloak-client-secret: {{ required "api.secrets.keycloakClientSecret is required when keycloak is in auth.providers" .Values.api.secrets.keycloakClientSecret | quote }}
  {{- end }}
  {{- if .Values.api.secrets.privateKey }}
  private-key: |
    {{- .Values.api.secrets.privateKey | nindent 4 }}
  {{- end }}
{{- end }}
