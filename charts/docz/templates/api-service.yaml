apiVersion: v1
kind: Service
metadata:
  name: {{ include "docz.componentFullname" (dict "ctx" . "component" "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docz.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "docz.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
