# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: shared helpers (names and labels)
templates:
  - templates/tests/helpers-probe.yaml
set:
  helpersProbe: true
tests:
  - it: a release named docz keeps the bare chart name
    release:
      name: docz
    asserts:
      - equal:
          path: data.fullname
          value: docz
      - equal:
          path: metadata.name
          value: docz-api

  - it: another release name is prefixed onto the chart name
    release:
      name: prod
    asserts:
      - equal:
          path: data.fullname
          value: prod-docz
      - equal:
          path: metadata.name
          value: prod-docz-api

  - it: fullnameOverride replaces the prefix
    set:
      fullnameOverride: lab
    asserts:
      - equal:
          path: metadata.name
          value: lab-api

  - it: labels carry the role and no extraLabels by default
    release:
      name: docz
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: docz
      - notExists:
          path: metadata.labels.owner

  - it: extraLabels are appended
    set:
      extraLabels:
        owner: lab
    asserts:
      - equal:
          path: metadata.labels.owner
          value: lab

  - it: an extraLabels key the chart sets fails the render
    set:
      extraLabels:
        app.kubernetes.io/name: other
    asserts:
      - failedTemplate:
          errorPattern: 'extraLabels: "app.kubernetes.io/name" is set by the chart'
