# yaml-language-server: $schema=https://json.schemastore.org/helm-testsuite.json
# One Ingress and one HTTPRoute per workload, each sent to that workload's own
# Service and port and to no other (DESIGN-0018 §5, OQ 8 revised).
suite: edges
templates:
  - templates/api-ingress.yaml
  - templates/api-httproute.yaml
  - templates/site-ingress.yaml
  - templates/site-httproute.yaml
release:
  name: docz
set:
  api:
    service:
      port: 8081
    ingress:
      hosts:
        - host: api.example.com
          paths:
            - path: /webhooks/github
              pathType: Prefix
    httpRoute:
      hostnames: [api.example.com]
  site:
    service:
      port: 8082
    ingress:
      hosts:
        - host: docz.example.com
          paths:
            - path: /
              pathType: Prefix
    httpRoute:
      hostnames: [docz.example.com]
tests:
  - it: renders no edge by default
    set:
      api:
        ingress:
          enabled: false
      site:
        ingress:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: the API Ingress routes to the API Service and port only
    set:
      api:
        ingress:
          enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: docz-api
        template: templates/api-ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: docz-api
            port:
              number: 8081
        template: templates/api-ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/site-ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/site-httproute.yaml

  - it: the site Ingress routes to the site Service and port only
    set:
      site:
        ingress:
          enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: docz-site
        template: templates/site-ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: docz-site
            port:
              number: 8082
        template: templates/site-ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/api-ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/api-httproute.yaml

  - it: an empty rules list gives the API HTTPRoute a default rule to the API
    set:
      api:
        httpRoute:
          enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: docz-api
        template: templates/api-httproute.yaml
      - equal:
          path: spec.rules
          value:
            - backendRefs:
                - name: docz-api
                  port: 8081
                  weight: 1
        template: templates/api-httproute.yaml
      - hasDocuments:
          count: 0
        template: templates/site-httproute.yaml

  - it: an empty rules list gives the site HTTPRoute a default rule to the site
    set:
      site:
        httpRoute:
          enabled: true
    asserts:
      - equal:
          path: spec.rules
          value:
            - backendRefs:
                - name: docz-site
                  port: 8082
                  weight: 1
        template: templates/site-httproute.yaml
      - hasDocuments:
          count: 0
        template: templates/api-httproute.yaml

  - it: explicit rules keep their matches and still route to the workload
    set:
      api:
        httpRoute:
          enabled: true
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /webhooks
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /webhooks
        template: templates/api-httproute.yaml
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: docz-api
        template: templates/api-httproute.yaml

  - it: api.ingress.className tailscale renders as given
    # The only edge setting deploy/tailscale-operator.md needs.
    set:
      api:
        ingress:
          enabled: true
          className: tailscale
    asserts:
      - equal:
          path: spec.ingressClassName
          value: tailscale
        template: templates/api-ingress.yaml
