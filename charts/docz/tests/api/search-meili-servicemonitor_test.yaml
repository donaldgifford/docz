# yaml-language-server: $schema=https://json.schemastore.org/helm-testsuite.json
suite: search-meili servicemonitor
templates:
  - templates/search-meili-servicemonitor.yaml
set:
  search:
    meili:
      masterKey: "meili-master"
tests:
  - it: should not create a meilisearch servicemonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a meilisearch servicemonitor when metrics and serviceMonitor are on
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ServiceMonitor
      - equal:
          path: metadata.name
          value: RELEASE-NAME-docz-meilisearch

  - it: should not create one when metrics are disabled
    set:
      serviceMonitor:
        enabled: true
      metrics:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create one for an external meilisearch
    set:
      serviceMonitor:
        enabled: true
      search:
        meili:
          mode: external
          host: http://meili.example:7700
          external:
            existingSecret: ext-meili
    asserts:
      - hasDocuments:
          count: 0

  - it: should select only the meilisearch Service
    # The Meilisearch and API Services share name/instance labels and both
    # expose an http-named port, so component is the only thing keeping the
    # two scrapes apart — and this one carries a bearer token the API must
    # never receive.
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: meilisearch
      - isSubset:
          path: spec.selector.matchLabels
          content:
            app.kubernetes.io/name: docz
            app.kubernetes.io/instance: RELEASE-NAME

  - it: should scrape /metrics on the http port with the master key as a bearer token
    set:
      serviceMonitor:
        enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: http
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].authorization
          value:
            type: Bearer
            credentials:
              name: RELEASE-NAME-docz-meilisearch
              key: MEILI_API_KEY

  - it: should source the bearer token from existingSecret when set
    set:
      serviceMonitor:
        enabled: true
      search:
        meili:
          existingSecret: my-meili-secret
          existingSecretKey: master-key
    asserts:
      - equal:
          path: spec.endpoints[0].authorization.credentials
          value:
            name: my-meili-secret
            key: master-key

  - it: should honour the shared interval and labels
    set:
      serviceMonitor:
        enabled: true
        interval: 15s
        labels:
          prometheus: kube-prometheus
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 15s
      - equal:
          path: metadata.labels.prometheus
          value: kube-prometheus
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: meilisearch
