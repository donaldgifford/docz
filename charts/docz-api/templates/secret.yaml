{{- $providers := include "docz-api.authProviders" . | fromJsonArray -}}
{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docz-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docz-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-id: {{ required "config.appId is required" .Values.config.appId | quote }}
  webhook-secret: {{ required "secrets.webhookSecret is required" .Values.secrets.webhookSecret | quote }}
  {{- if not (include "docz-api.authDisabled" .) }}
  session-secret: {{ required "secrets.sessionSecret is required" .Values.secrets.sessionSecret | quote }}
  {{- end }}
  {{- if has "github" $providers }}
  oauth-client-secret: {{ required "secrets.oauthClientSecret is required when github is in config.authProviders" .Values.secrets.oauthClientSecret | quote }}
  {{- end }}
  {{- if has "okta" $providers }}
  okta-client-secret: {{ required "secrets.oktaClientSecret is required when okta is in config.authProviders" .Values.secrets.oktaClientSecret | quote }}
  {{- end }}
  {{- if has "keycloak" $providers }}
  keycloak-client-secret: {{ required "secrets.keycloakClientSecret is required when keycloak is in config.authProviders" .Values.secrets.keycloakClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.privateKey }}
  private-key: |
    {{- .Values.secrets.privateKey | nindent 4 }}
  {{- end }}
{{- end }}
