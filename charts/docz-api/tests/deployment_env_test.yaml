# yaml-language-server: $schema=https://json.schemastore.org/helm-testsuite.json
suite: deployment-env
templates:
  - templates/deployment.yaml
set:
  config:
    authRedirectBase: "https://docz.example.com"
    githubOAuthClientID: "gh-client-id"
tests:
  - it: emits the core plain-value env vars
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTP_ADDR
            value: ":8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "info"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_FORMAT
            value: "json"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_REDIRECT_BASE
            value: "https://docz.example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_PROVIDERS
            value: "github"

  - it: sources the app secrets with the right keys
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api
                key: app-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api
                key: webhook-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api
                key: session-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api
                key: oauth-client-secret

  - it: sources the backing-service DSNs from the baked secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api-postgres
                key: DATABASE_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api-valkey
                key: REDIS_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEILI_HOST
            value: "http://RELEASE-NAME-docz-api-meilisearch:7700"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEILI_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api-meilisearch
                key: MEILI_API_KEY

  - it: omits the optional tuning env vars when unset
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_API_BASE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_TTL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGEST_DEBOUNCE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
          any: true

  - it: emits the optional tuning env vars when set
    set:
      config:
        githubApiBase: "https://ghe.example.com/api/v3"
        sessionTTL: "168h"
        ingestDebounce: "10s"
      otel:
        endpoint: "otel-collector:4318"
        serviceName: "docz-api"
        sampleRate: "0.5"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_API_BASE
            value: "https://ghe.example.com/api/v3"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_TTL
            value: "168h"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGEST_DEBOUNCE
            value: "10s"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "otel-collector:4318"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: "docz-api"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SAMPLE_RATE
            value: "0.5"

  - it: passes extraEnv through
    set:
      extraEnv:
        - name: CUSTOM_VAR
          value: custom-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_VAR
            value: custom-value

  - it: omits every OIDC provider env when only github is enabled
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OKTA_ISSUER
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: KEYCLOAK_ISSUER

  - it: emits the Okta trio when okta is in authProviders
    set:
      config:
        authProviders: "github,okta"
        oktaIssuer: "https://acme.okta.com/oauth2/default"
        oktaClientID: "0oaEXAMPLE"
      secrets:
        oktaClientSecret: "okta-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OKTA_ISSUER
            value: "https://acme.okta.com/oauth2/default"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OKTA_CLIENT_ID
            value: "0oaEXAMPLE"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OKTA_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api
                key: okta-client-secret

  - it: emits the Keycloak trio when keycloak is in authProviders
    set:
      config:
        authProviders: "keycloak"
        keycloakIssuer: "https://kc.example.com/realms/docz-api"
        keycloakClientID: "docz-api"
      secrets:
        keycloakClientSecret: "kc-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_ISSUER
            value: "https://kc.example.com/realms/docz-api"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api
                key: keycloak-client-secret

  - it: drops the GitHub OAuth env when github is not a provider
    set:
      config:
        authProviders: "okta"
        oktaIssuer: "https://acme.okta.com/oauth2/default"
        oktaClientID: "0oaEXAMPLE"
      secrets:
        oktaClientSecret: "okta-secret"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: GITHUB_OAUTH_CLIENT_ID
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: GITHUB_OAUTH_CLIENT_SECRET

  - it: tolerates whitespace around the provider list
    set:
      config:
        authProviders: "github, okta"
        oktaIssuer: "https://acme.okta.com/oauth2/default"
        oktaClientID: "0oaEXAMPLE"
      secrets:
        oktaClientSecret: "okta-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OKTA_CLIENT_ID
            value: "0oaEXAMPLE"

  - it: points every provider secret at an existingSecret when create=false
    set:
      config:
        authProviders: "github,okta,keycloak"
        oktaIssuer: "https://acme.okta.com/oauth2/default"
        oktaClientID: "0oaEXAMPLE"
        keycloakIssuer: "https://kc.example.com/realms/docz-api"
        keycloakClientID: "docz-api"
      secrets:
        create: false
        existingSecret: "docz-api-external"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: docz-api-external
                key: oauth-client-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OKTA_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: docz-api-external
                key: okta-client-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: docz-api-external
                key: keycloak-client-secret

  - it: fails the render when an enabled provider is missing its issuer
    set:
      config:
        authProviders: "github,okta"
        oktaClientID: "0oaEXAMPLE"
      secrets:
        oktaClientSecret: "okta-secret"
    asserts:
      - failedTemplate:
          errorMessage: config.oktaIssuer is required when okta is in config.authProviders

  - it: drops the session secret and redirect base under none-mode
    set:
      config:
        authProviders: "none"
        authRedirectBase: ""
        githubOAuthClientID: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_PROVIDERS
            value: "none"
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: AUTH_REDIRECT_BASE
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: SESSION_SECRET
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: GITHUB_OAUTH_CLIENT_ID
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OKTA_ISSUER
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: KEYCLOAK_ISSUER
      # none-mode is precisely the shape where the GitHub App credentials are
      # the only ones that matter, so they must still be wired.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-docz-api
                key: app-id

  - it: fails the render when none is combined with a real provider
    set:
      config:
        authProviders: "none,github"
    asserts:
      # Without this the chart would drop SESSION_SECRET and AUTH_REDIRECT_BASE
      # while still rendering GITHUB_OAUTH_*, installing cleanly and then
      # crash-looping on the binary's own validation.
      - failedTemplate:
          errorMessage: 'config.authProviders: "none" must be the only entry when present'

