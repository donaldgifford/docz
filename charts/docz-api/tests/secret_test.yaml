# yaml-language-server: $schema=https://json.schemastore.org/helm-testsuite.json
suite: secret
templates:
  - templates/secret.yaml
set:
  config:
    appId: "12345"
  secrets:
    webhookSecret: "whsec"
    privateKey: "pem-body"
    sessionSecret: "sess"
    oauthClientSecret: "oauth"
tests:
  - it: should create secret when secrets.create is true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret

  - it: should not create secret when secrets.create is false
    set:
      secrets:
        create: false
        existingSecret: "my-existing-secret"
    asserts:
      - hasDocuments:
          count: 0

  - it: should carry the always-on keys plus the github provider key
    set:
      config:
        appId: "99999"
      secrets:
        webhookSecret: "super-secret"
        privateKey: "my-pem-key"
        sessionSecret: "session-secret"
        oauthClientSecret: "oauth-secret"
    asserts:
      - equal:
          path: stringData.app-id
          value: "99999"
      - equal:
          path: stringData.webhook-secret
          value: "super-secret"
      - equal:
          path: stringData.session-secret
          value: "session-secret"
      - equal:
          path: stringData.oauth-client-secret
          value: "oauth-secret"
      - isNotNullOrEmpty:
          path: stringData.private-key

  - it: should omit the private key when unset
    set:
      secrets:
        privateKey: ""
    asserts:
      - notExists:
          path: stringData.private-key

  - it: should omit disabled providers' client-secret keys
    asserts:
      - notExists:
          path: stringData.okta-client-secret
      - notExists:
          path: stringData.keycloak-client-secret

  - it: should add a provider key for each enabled provider
    set:
      config:
        authProviders: "github,okta,keycloak"
      secrets:
        oktaClientSecret: "okta-secret"
        keycloakClientSecret: "kc-secret"
    asserts:
      - equal:
          path: stringData.oauth-client-secret
          value: "oauth"
      - equal:
          path: stringData.okta-client-secret
          value: "okta-secret"
      - equal:
          path: stringData.keycloak-client-secret
          value: "kc-secret"

  - it: should drop the github key when github is not a provider
    set:
      config:
        authProviders: "okta"
      secrets:
        oktaClientSecret: "okta-secret"
    asserts:
      - notExists:
          path: stringData.oauth-client-secret
      - equal:
          path: stringData.okta-client-secret
          value: "okta-secret"

  - it: should fail the render when an enabled provider has no client secret
    set:
      config:
        authProviders: "github,okta"
    asserts:
      - failedTemplate:
          errorMessage: secrets.oktaClientSecret is required when okta is in config.authProviders
