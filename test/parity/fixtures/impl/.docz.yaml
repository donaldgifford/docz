# Parity fixture: the impl type. author is pinned (from_git: false) so
# `docz create` output does not depend on the machine running the suite.

docs_dir: docs

types:
  impl:
    enabled: true
    dir: impl
    template: ""
    id_prefix: "IMPL"
    id_width: 4
    statuses:
      - Draft
      - In Progress
      - Completed
      - Paused
      - Cancelled
    status_field: "status"
    plural_label: "Implementation Plans"

index:
  auto_update: true
  preserve_header: true

author:
  from_git: false
  default: "Parity Fixture"

wiki:
  auto_update: true
  mkdocs_path: mkdocs.yml
  plugins:
    - techdocs-core
  exclude:
    - templates
    - examples
  nav_titles:
    impl: Implementation Plans

toc:
  enabled: true
  min_headings: 3
