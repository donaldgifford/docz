# Parity fixture: the design type. author is pinned (from_git: false) so
# `docz create` output does not depend on the machine running the suite.

docs_dir: docs

types:
  design:
    enabled: true
    dir: design
    template: ""
    id_prefix: "DESIGN"
    id_width: 4
    statuses:
      - Draft
      - In Review
      - Approved
      - Implemented
      - Abandoned
    status_field: "status"
    plural_label: "Design"

index:
  auto_update: true
  preserve_header: true

author:
  from_git: false
  default: "Parity Fixture"

wiki:
  auto_update: true
  mkdocs_path: mkdocs.yml
  plugins:
    - techdocs-core
  exclude:
    - templates
    - examples
  nav_titles:
    design: Design

toc:
  enabled: true
  min_headings: 3
