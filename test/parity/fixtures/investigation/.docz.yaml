# Parity fixture: the investigation type. author is pinned (from_git: false) so
# `docz create` output does not depend on the machine running the suite.

docs_dir: docs

types:
  investigation:
    enabled: true
    dir: investigation
    template: ""
    id_prefix: "INV"
    id_width: 4
    statuses:
      - Open
      - In Progress
      - Concluded
      - Inconclusive
      - Abandoned
    status_field: "status"
    plural_label: "Investigations"

index:
  auto_update: true
  preserve_header: true

author:
  from_git: false
  default: "Parity Fixture"

wiki:
  auto_update: true
  mkdocs_path: mkdocs.yml
  plugins:
    - techdocs-core
  exclude:
    - templates
    - examples
  nav_titles:
    investigation: Investigations

toc:
  enabled: true
  min_headings: 3
