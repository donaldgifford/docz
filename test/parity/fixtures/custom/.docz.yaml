# Parity fixture: a custom type beside a built-in one. `frameworks` is
# resolvable by name, by its `fw` alias, and by its `FW` id_prefix, which is
# what the resolution cases in the parity driver exercise. author is pinned
# (from_git: false) so `docz create` output does not depend on the machine
# running the suite.

docs_dir: docs

types:
  adr:
    enabled: true
    dir: adr
    template: ""
    id_prefix: "ADR"
    id_width: 4
    statuses:
      - Proposed
      - Accepted
      - Deprecated
      - Superseded
    status_field: "status"
    plural_label: "ADRs"

  frameworks:
    enabled: true
    dir: frameworks
    template: ""
    id_prefix: "FW"
    id_width: 4
    aliases: ["fw"]
    statuses:
      - Draft
      - Active
      - Deprecated
    status_field: "status"
    plural_label: "Frameworks"

index:
  auto_update: true
  preserve_header: true

author:
  from_git: false
  default: "Parity Fixture"

wiki:
  auto_update: true
  mkdocs_path: mkdocs.yml
  plugins:
    - techdocs-core
  exclude:
    - templates
    - examples
  nav_titles:
    adr: ADRs
    frameworks: Frameworks

toc:
  enabled: true
  min_headings: 3
