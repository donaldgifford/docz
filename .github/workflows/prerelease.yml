---
# $schema=https://www.schemastore.org/github-action.json
#
# Pre-release builds for hand-pushed beta tags (IMPL-0018 Phase 0, ADR-0002
# Open Question 3).
#
# Nothing on the v2 line is released by label: every pull request carries
# `dont-release`, and a beta is cut by pushing the tag yourself
# (`just release v2.0.0-beta.1`). This workflow is what turns that tag
# into binaries.
#
# It deliberately has no bump-version job. release.yml stays on
# `push: branches: [main]`, so its pr-semver-bump step never sees a tag
# event and the two workflows cannot both claim the same version.
#
# goreleaser's `prerelease: auto` marks the GitHub release as a pre-release
# on its own, because the tag carries a `-beta.N` suffix.
#
# Since IMPL-0019 the tag also publishes docz-api: goreleaser builds both
# binaries (docz-api's archives carry a syft SBOM), and publish-image pushes
# ghcr.io/donaldgifford/docz-api:<tag> plus the chart through ghcr.yml. ECR
# stays behind vars.ECR_PUBLISH_ENABLED, as on release.yml. Since IMPL-0020
# publish-image-ui does the same for ghcr.io/donaldgifford/docz-site and its
# chart; each GHCR package needs its own Actions access grant for this repo.
# Since IMPL-0021 publish-chart pushes charts/docz, the one chart for both,
# as ghcr.io/donaldgifford/charts/docz. Charts publish only from this tag:
# release.yml passes publish_chart: false.
name: Pre-release

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

jobs:
  release:
    name: Pre-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads the tag history to build the changelog, so a
          # shallow checkout gives it nothing to work with.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # docz-api's archives carry an SPDX SBOM (.goreleaser.yml sboms:).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}

  # The server's image and chart for the same tag. ghcr.yml's image job runs
  # because tag is set; its chart job skips a chart version already published.
  # Caller-job permissions are a hard ceiling for the reusable workflow, so
  # every permission ghcr.yml declares is granted here.
  publish-image:
    name: Publish docz-api to GHCR
    uses: ./.github/workflows/ghcr.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      component: api
      tag: ${{ github.ref_name }}
      dry_run: false
    secrets: inherit

  publish-ecr:
    name: Publish docz-api to ECR
    if: vars.ECR_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ecr.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      component: api
      tag: ${{ github.ref_name }}
      dry_run: false
    secrets: inherit

  # docz-site's image and chart for the same tag (IMPL-0020): the same pair
  # of reusable workflows with component: ui, and the same ceiling.
  publish-image-ui:
    name: Publish docz-site to GHCR
    uses: ./.github/workflows/ghcr.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      component: ui
      tag: ${{ github.ref_name }}
      dry_run: false
    secrets: inherit

  publish-ecr-ui:
    name: Publish docz-site to ECR
    if: vars.ECR_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ecr.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      component: ui
      tag: ${{ github.ref_name }}
      dry_run: false
    secrets: inherit

  # charts/docz (IMPL-0021): one chart for both images, with no image of its
  # own, so no tag is passed and the image job skips. Same ceiling as above.
  # The chart's GHCR package needs its own Actions access grant for this
  # repository; the first push fails 403 write_package until it has one.
  publish-chart:
    name: Publish charts/docz to GHCR
    uses: ./.github/workflows/ghcr.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      component: chart
      dry_run: false
    secrets: inherit

  publish-ecr-chart:
    name: Publish charts/docz to ECR
    if: vars.ECR_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ecr.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      component: chart
      dry_run: false
    secrets: inherit
