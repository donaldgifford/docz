---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 0000 — same slot as security.yml's grype scan.
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers ui/ (docz-site, IMPL-0020 Phase 2).
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.35.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # JavaScript/TypeScript needs no build step; CodeQL extracts the source.
      - name: Autobuild
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@v4.35.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.35.5
        with:
          category: /language:${{ matrix.language }}
