---
# $schema=https://www.schemastore.org/github-action.json
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: read
  id-token: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.version }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jefflinse/pr-semver-bump@v1.7.4
        id: bump
        name: Bump and Tag Version
        with:
          mode: bump
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          require-release-notes: false
          major-label: major
          minor-label: minor
          patch-label: patch
          noop-labels: "dont-release"
          release-notes-prefix: "### RELEASE NOTES"
          with-v: true

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: bump-version
    if: needs.bump-version.outputs.skipped != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # docz-api's archives carry an SPDX SBOM (.goreleaser.yml sboms:).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      # Not for signing (the checksums are GPG-signed): goreleaser-action
      # uses cosign, when it is on PATH, to verify the signature on the
      # GoReleaser download it fetches, and skips that check without it.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}

  # The image publish jobs run on every main push, NOT gated on the binary
  # release: the internal `image` job is gated on `inputs.tag != ''`, so it
  # only fires on a real release. The api and ui components have no chart
  # since #140, so these calls never publish one; charts/docz is
  # publish-chart below.
  publish-ghcr:
    name: Publish to GHCR
    needs: bump-version
    uses: ./.github/workflows/ghcr.yml
    # attestations: write is required by actions/attest-build-provenance
    # inside ghcr.yml. Caller-job permissions are a hard ceiling for called
    # reusable workflows — omitting a permission the callee needs fails the
    # whole run at startup (zero jobs created) before anything executes.
    # (actions: read was dropped with the nested SLSA generator jobs, INV-0006.)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      component: api
      tag: ${{ needs.bump-version.outputs.tag }}
      dry_run: false
    secrets: inherit

  publish-ecr:
    name: Publish to ECR
    needs: bump-version
    # Disabled by default. Set repo variable ECR_PUBLISH_ENABLED=true
    # (Settings → Secrets and variables → Actions → Variables) once the
    # AWS-side prep in docs/operations/ecr-publish-setup.md is complete.
    # ecr.yml remains directly invokable via workflow_dispatch for
    # standalone testing regardless of this gate.
    if: vars.ECR_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ecr.yml
    # attestations: write — same requirement as publish-ghcr. The uses:
    # graph is validated at startup even though this job is gated off by
    # the if: condition. packages: write is retained: ecr.yml is a public
    # reusable workflow surface and the ceiling costs nothing here.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      component: api
      tag: ${{ needs.bump-version.outputs.tag }}
      dry_run: false
    secrets: inherit

  # docz-site's pair (IMPL-0020): the same reusable workflows with
  # component: ui and the same permissions ceiling as publish-ghcr and
  # publish-ecr above, whose comments apply here unchanged.
  publish-ghcr-ui:
    name: Publish docz-site to GHCR
    needs: bump-version
    uses: ./.github/workflows/ghcr.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      component: ui
      tag: ${{ needs.bump-version.outputs.tag }}
      dry_run: false
    secrets: inherit

  publish-ecr-ui:
    name: Publish docz-site to ECR
    needs: bump-version
    if: vars.ECR_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ecr.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      component: ui
      tag: ${{ needs.bump-version.outputs.tag }}
      dry_run: false
    secrets: inherit

  # charts/docz on a real release only, so a dont-release merge never
  # publishes a chart version (IMPL-0021 OQ 2). Without this job a release
  # cut by label (v2.0.0 is one) published the images and no chart. The
  # chart job skips a version already published, so a release that did not
  # bump Chart.yaml is a no-op. Same permissions ceiling as publish-ghcr.
  publish-chart:
    name: Publish charts/docz to GHCR
    needs: bump-version
    if: needs.bump-version.outputs.skipped != 'true'
    uses: ./.github/workflows/ghcr.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      component: chart
      dry_run: false
    secrets: inherit

  publish-ecr-chart:
    name: Publish charts/docz to ECR
    needs: bump-version
    if: needs.bump-version.outputs.skipped != 'true' && vars.ECR_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ecr.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      component: chart
      dry_run: false
    secrets: inherit
