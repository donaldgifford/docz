---
# $schema=https://www.schemastore.org/github-action.json
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: read
  id-token: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.version }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jefflinse/pr-semver-bump@v1.7.4
        id: bump
        name: Bump and Tag Version
        with:
          mode: bump
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          require-release-notes: false
          major-label: major
          minor-label: minor
          patch-label: patch
          noop-labels: "dont-release"
          release-notes-prefix: "### RELEASE NOTES"
          with-v: true

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: bump-version
    if: needs.bump-version.outputs.skipped != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # docz-api's archives carry an SPDX SBOM (.goreleaser.yml sboms:).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}

  # The two publish workflows run on every main push, NOT gated on the
  # binary release. The internal `image` job is gated on `inputs.tag != ''`
  # so it only fires on a real release; the internal `chart` job is
  # idempotent (skips when the chart version is already published).
  # This lets chart-only changes (PR with `dont-release` label) publish
  # the chart even though no binary release happened.
  publish-ghcr:
    name: Publish to GHCR
    needs: bump-version
    uses: ./.github/workflows/ghcr.yml
    # attestations: write is required by actions/attest-build-provenance
    # inside ghcr.yml. Caller-job permissions are a hard ceiling for called
    # reusable workflows — omitting a permission the callee needs fails the
    # whole run at startup (zero jobs created) before anything executes.
    # (actions: read was dropped with the nested SLSA generator jobs, INV-0006.)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      component: api
      tag: ${{ needs.bump-version.outputs.tag }}
      dry_run: false
      publish_chart: false
    secrets: inherit

  publish-ecr:
    name: Publish to ECR
    needs: bump-version
    # Disabled by default. Set repo variable ECR_PUBLISH_ENABLED=true
    # (Settings → Secrets and variables → Actions → Variables) once the
    # AWS-side prep in docs/operations/ecr-publish-setup.md is complete.
    # ecr.yml remains directly invokable via workflow_dispatch for
    # standalone testing regardless of this gate.
    if: vars.ECR_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ecr.yml
    # attestations: write — same requirement as publish-ghcr. The uses:
    # graph is validated at startup even though this job is gated off by
    # the if: condition. packages: write is retained: ecr.yml is a public
    # reusable workflow surface and the ceiling costs nothing here.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      component: api
      tag: ${{ needs.bump-version.outputs.tag }}
      dry_run: false
      publish_chart: false
    secrets: inherit

  # docz-site's pair (IMPL-0020): the same reusable workflows with
  # component: ui and the same permissions ceiling as publish-ghcr and
  # publish-ecr above, whose comments apply here unchanged.
  publish-ghcr-ui:
    name: Publish docz-site to GHCR
    needs: bump-version
    uses: ./.github/workflows/ghcr.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      component: ui
      tag: ${{ needs.bump-version.outputs.tag }}
      dry_run: false
      publish_chart: false
    secrets: inherit

  publish-ecr-ui:
    name: Publish docz-site to ECR
    needs: bump-version
    if: vars.ECR_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ecr.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      component: ui
      tag: ${{ needs.bump-version.outputs.tag }}
      dry_run: false
      publish_chart: false
    secrets: inherit
