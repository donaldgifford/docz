---
# $schema=https://www.schemastore.org/github-action.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
      workflows: ${{ steps.filter.outputs.workflows }}
      alerts: ${{ steps.filter.outputs.alerts }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            docker:
              - 'Dockerfile.api'
              - 'docker-bake.hcl'
              - '.dockerignore'
            helm:
              - 'charts/**'
            workflows:
              - '.github/workflows/**'
            alerts:
              - 'contrib/prometheus/**'
            # No job reads this until the ui jobs land (IMPL-0020 Phase 2).
            # The spec is here because orval generates the ui client from it.
            ui:
              - 'ui/**'
              - 'api/openapi.yaml'
              - 'Dockerfile.ui'

  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Label PR
    steps:
      - name: Checkout code
        uses: actions/labeler@v6
  lint:
    name: Lint
    # Skipped on the one PR carrying the `graft` label: the docz-api history
    # merge lands with imports that only the next phase rewrites, so it is
    # red by decision (DESIGN-0016 OQ 6). Required labels still run.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'graft') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  lint-alerts:
    name: Lint Prometheus Alerts
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.alerts == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise (for just + promtool)
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Validate Prometheus alert rules
        run: just api lint-alerts

  test-go:
    name: Test Go
    # Skipped on the one PR carrying the `graft` label: the docz-api history
    # merge lands with imports that only the next phase rewrites, so it is
    # red by decision (DESIGN-0016 OQ 6). Required labels still run.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'graft') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run unit tests
        run: just test-coverage

      - name: Run consumer smoke test (external module)
        run: just test-consumer

      # The goldens are captured from the v1.2.2 release and never from a v2
      # build, so this is what keeps the rewritten CLI answering as the old one
      # did. Only the deltas named in test/parity/README.md are permitted.
      - name: Replay functional parity goldens
        run: just parity

      # Non-strict: an error in docz's own corpus fails, a warning prints.
      - name: Validate this repository's docs
        run: just validate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: donaldgifford/docz
        continue-on-error: true

  security:
    name: Security Scan
    # Skipped on the one PR carrying the `graft` label: the docz-api history
    # merge lands with imports that only the next phase rewrites, so it is
    # red by decision (DESIGN-0016 OQ 6). Required labels still run.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'graft') }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      # cache: false — govulncheck-action does its own setup-go with module
      # caching; letting this step also cache $GOMODCACHE makes the action's
      # tar restore collide with the already-populated cache ("Cannot open:
      # File exists"), failing the job before any scan runs.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run govulncheck
        uses: donaldgifford/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    name: Build
    # Skipped on the one PR carrying the `graft` label: the docz-api history
    # merge lands with imports that only the next phase rewrites, so it is
    # red by decision (DESIGN-0016 OQ 6). Required labels still run.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'graft') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify builds for all platforms
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: changes
    # The graft guard as on the Go jobs, and the path filter as before.
    if: |
      !contains(github.event.pull_request.labels.*.name, 'graft') && (
        needs.changes.outputs.go == 'true' ||
        needs.changes.outputs.docker == 'true' ||
        needs.changes.outputs.workflows == 'true')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        if: github.event_name == 'pull_request'
        uses: docker/bake-action@v7
        with:
          targets: ci
          source: .
          files: docker-bake.hcl
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.output=type=registry

      - name: Build multi-arch images (post-merge validation)
        if: github.event_name == 'push'
        uses: docker/bake-action@v7
        with:
          targets: ci
          source: .
          files: docker-bake.hcl
          set: |-
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  helm-unittest:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.helm == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install helm-unittest plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest
      - name: Run helm-unittest
        run: helm unittest charts/docz-api

  helm-test:
    name: Helm Chart Test
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.helm == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: helm/chart-testing-action@v2
      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint charts
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml
      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1
      - name: Install and test charts
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml
