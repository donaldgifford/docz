---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret Scanning
        # No floating v3 tag exists upstream — pin the full release tag
        # (Renovate keeps it current). Carried over from docz-site.
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          # verified,unknown: a credential-shaped string trufflehog cannot
          # verify fails the job too (IMPL-0020 Open Question 4, docz-site's
          # rule kept). The known placeholder DSNs in history are excluded by
          # path, each with its reason, in .github/trufflehog-exclude.txt.
          extra_args: >-
            --results=verified,unknown
            --exclude-paths=.github/trufflehog-exclude.txt
