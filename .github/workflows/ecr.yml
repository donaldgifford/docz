---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Publish to ECR

# Called from prerelease.yml / release.yml once per component. Also
# dispatchable for ad-hoc republishes. Four jobs:
#   resolve  — map `component` to the image repo, bake target, and chart
#   aws-auth — OIDC + ECR registry hostname
#   image    — push container image when `tag` is supplied
#   chart    — push Helm chart; idempotent via `helm pull` precheck
#
# Operator prep (one-time, outside this workflow):
#   - IAM role with GitHub OIDC trust policy for repo:donaldgifford/docz:*
#   - ECR repos, one image and one chart per component (see the resolve job)
#   - Repo secrets: ECR_AWS_ACCOUNT_ID, ECR_REGION, ECR_ROLE_ARN
on:
  workflow_call:
    inputs:
      component:
        description: 'Component to publish (api, ui, or chart); the resolve job maps it to names. chart is charts/docz alone: it has no image, so pass no tag.'
        type: string
        required: false
        default: 'api'
      tag:
        description: 'Image tag to publish (e.g. v1.8.2). Empty = skip image push.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Package but do not push.'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to publish (api, ui, or chart); the resolve job maps it to names. chart is charts/docz alone: it has no image, so pass no tag.'
        type: choice
        options: [api, ui, chart]
        default: 'api'
      tag:
        description: 'Image tag to publish (e.g. v1.8.2). Leave empty to skip image push.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Package but do not push.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  # attestations: write — required by actions/attest-build-provenance.
  attestations: write

jobs:
  # The one place a component's names live (DESIGN-0017 §8). The image job
  # and the chart job read only these outputs. In ECR the chart repository
  # is named for the chart, so CHART_REPO is CHART_NAME.
  resolve:
    name: Resolve component
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.resolve.outputs.image_name }}
      bake_target: ${{ steps.resolve.outputs.bake_target }}
      chart_name: ${{ steps.resolve.outputs.chart_name }}
      chart_dir: ${{ steps.resolve.outputs.chart_dir }}
    steps:
      - name: Resolve component
        id: resolve
        env:
          COMPONENT: ${{ inputs.component }}
        # component | image name | bake target | chart name | chart dir
        run: |
          case "${COMPONENT}" in
            api) row="docz-api  release-api docz-api  charts/docz-api" ;;
            ui)  row="docz-site release-ui  docz-site charts/docz-site" ;;
            # charts/docz ships both images, so it has no image of its own:
            # `-` fills the fields read -r needs, and the image job already
            # skips when no tag is passed (IMPL-0021 OQ 3).
            chart) row="-         -           docz      charts/docz" ;;
            *)     echo "ERROR: unknown component '${COMPONENT}' (want api, ui, or chart)"; exit 1 ;;
          esac
          read -r image_name bake_target chart_name chart_dir <<< "${row}"
          {
            echo "image_name=${image_name}"
            echo "bake_target=${bake_target}"
            echo "chart_name=${chart_name}"
            echo "chart_dir=${chart_dir}"
          } >> "$GITHUB_OUTPUT"
          echo "component=${COMPONENT} -> ${image_name}, ${bake_target}, ${chart_dir}"

  # Fetches an ECR auth token via OIDC and exposes it (masked) to the
  # downstream SLSA reusable workflows. Token is valid ~12h.
  aws-auth:
    name: AWS OIDC + ECR login
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.registry.outputs.registry }}
      ecr_password: ${{ steps.token.outputs.password }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          role-session-name: github-actions-docz-publish
          aws-region: ${{ secrets.ECR_REGION }}

      - name: Compute registry hostname
        id: registry
        run: |
          echo "registry=${{ secrets.ECR_AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.ECR_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Get ECR auth token
        id: token
        run: |
          password=$(aws ecr get-login-password --region "${{ secrets.ECR_REGION }}")
          echo "::add-mask::${password}"
          echo "password=${password}" >> "$GITHUB_OUTPUT"

  image:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [resolve, aws-auth]
    if: inputs.tag != ''
    env:
      IMAGE_NAME: ${{ needs.resolve.outputs.image_name }}
      BAKE_TARGET: ${{ needs.resolve.outputs.bake_target }}
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      published: ${{ steps.digest.outputs.published }}
      registry: ${{ needs.aws-auth.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          role-session-name: github-actions-docz-image
          aws-region: ${{ secrets.ECR_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # docker-bake.hcl's release-<component> inherits its tags from
          # this target; the component was validated by the resolve job.
          bake-target: docker-metadata-action-${{ inputs.component }}
          images: ${{ needs.aws-auth.outputs.registry }}/${{ env.IMAGE_NAME }}
          # No `type=raw,value=latest` while the v2 line ships betas: it moved
          # latest on every publish, a v2.0.0-beta.N included. Planned to come
          # back. metadata-action's default flavor (latest=auto) still tags
          # latest for a non-prerelease semver, and {{major}}.{{minor}} skips a
          # prerelease the same way, so a beta gets exactly one tag: 2.0.0-beta.N.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}

      # bake reads VERSION/COMMIT_SHA/BUILD_DATE from same-named env vars and
      # feeds them to the Dockerfile.api ARGs (-> -ldflags main.version/commit/date).
      # metadata-action fixes tags/labels only, not the compiled-in version.
      - name: Compute build metadata
        run: |
          {
            echo "VERSION=${{ inputs.tag }}"
            echo "COMMIT_SHA=${{ github.sha }}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Build and push image
        id: bake
        if: inputs.dry_run != true
        uses: docker/bake-action@v7
        with:
          targets: ${{ env.BAKE_TARGET }}
          source: .
          files: |
            docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-tags }}
            ${{ steps.meta.outputs.bake-file-labels }}
          set: |-
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Capture image digest
        id: digest
        if: steps.bake.conclusion == 'success' && inputs.dry_run != true
        # Metadata is passed via env, NOT interpolated into the script:
        # the bake metadata JSON can contain quotes/parens that break
        # shell syntax when inlined (broke the v1.8.2 release run).
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          digest=$(jq -r --arg t "${BAKE_TARGET}" '.[$t]."containerimage.digest"' <<< "${BAKE_METADATA}")
          if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
            echo "ERROR: failed to capture image digest from bake metadata"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign
        if: steps.digest.outputs.published == 'true'
        run: |
          cosign sign --yes \
            "${{ needs.aws-auth.outputs.registry }}/${IMAGE_NAME}@${{ steps.digest.outputs.digest }}"

      # Build provenance via GitHub's native attestation (INV-0006). In-job so
      # it reuses the amazon-ecr-login credentials already in the Docker
      # credential chain.
      - name: Attest image build provenance
        if: steps.digest.outputs.published == 'true'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ needs.aws-auth.outputs.registry }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Write image summary
        if: always()
        run: |
          {
            echo "## ECR Image Publish"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | \`${{ needs.aws-auth.outputs.registry }}/${IMAGE_NAME}\` |"
            echo "| Tag | \`${{ inputs.tag }}\` |"
            echo "| Pushed | \`${{ steps.digest.outputs.published || 'false' }}\` |"
            if [ -n "${{ steps.digest.outputs.digest }}" ]; then
              echo "| Digest | \`${{ steps.digest.outputs.digest }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Publish chart
    runs-on: ubuntu-latest
    needs: [resolve, aws-auth]
    env:
      CHART_NAME: ${{ needs.resolve.outputs.chart_name }}
      CHART_REPO: ${{ needs.resolve.outputs.chart_name }}
      CHART_DIR: ${{ needs.resolve.outputs.chart_dir }}
    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
      digest: ${{ steps.push.outputs.digest }}
      published: ${{ steps.push.outputs.published }}
      registry: ${{ needs.aws-auth.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_ARN }}
          role-session-name: github-actions-docz-chart
          aws-region: ${{ secrets.ECR_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: orhun/git-cliff-action@v4
        with:
          # Scoped to this component's chart: with two charts, "charts/**"
          # listed each chart's commits in the other's changelog.
          config: ${{ env.CHART_DIR }}/cliff.toml
          args: --include-path "${{ env.CHART_DIR }}/**" --output ${{ env.CHART_DIR }}/CHANGELOG.md
        env:
          OUTPUT: ${{ env.CHART_DIR }}/CHANGELOG.md

      - name: Read chart version
        id: version
        run: |
          chart_version=$(yq '.version' "${CHART_DIR}/Chart.yaml")
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${chart_version}"

      - name: Check if version already published
        id: idempotency
        run: |
          registry="${{ needs.aws-auth.outputs.registry }}"
          if helm pull \
              "oci://${registry}/${CHART_REPO}" \
              --version "${{ steps.version.outputs.chart_version }}" \
              --destination /tmp 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Chart ${{ steps.version.outputs.chart_version }} already published, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Helm registry login
        if: steps.idempotency.outputs.exists != 'true'
        run: |
          registry="${{ needs.aws-auth.outputs.registry }}"
          aws ecr get-login-password --region "${{ secrets.ECR_REGION }}" | \
            helm registry login "${registry}" \
              --username AWS \
              --password-stdin

      - name: Package chart
        if: steps.idempotency.outputs.exists != 'true'
        run: helm package "${CHART_DIR}"

      - name: Upload chart artifact (dispatch only)
        if: |
          steps.idempotency.outputs.exists != 'true' &&
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: chart-${{ steps.version.outputs.chart_version }}-ecr
          path: ${{ env.CHART_NAME }}-${{ steps.version.outputs.chart_version }}.tgz
          retention-days: 14

      - name: Push chart
        id: push
        if: |
          steps.idempotency.outputs.exists != 'true' &&
          inputs.dry_run != true
        run: |
          registry="${{ needs.aws-auth.outputs.registry }}"
          tgz="${CHART_NAME}-${{ steps.version.outputs.chart_version }}.tgz"
          helm push "${tgz}" "oci://${registry}/${CHART_REPO}" 2>&1 | tee /tmp/push.log
          digest=$(grep -oE 'sha256:[a-f0-9]{64}' /tmp/push.log | head -1)
          if [ -z "${digest}" ]; then
            echo "ERROR: failed to capture digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Sign chart with cosign
        if: steps.push.outputs.published == 'true'
        run: |
          cosign sign --yes \
            "${{ needs.aws-auth.outputs.registry }}/${CHART_REPO}@${{ steps.push.outputs.digest }}"

      # Build provenance via GitHub's native attestation (INV-0006). Also fixes
      # a latent bug in the removed chart-slsa job, which attested the *image*
      # name against the chart digest.
      - name: Attest chart build provenance
        if: steps.push.outputs.published == 'true'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ needs.aws-auth.outputs.registry }}/${{ env.CHART_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write chart summary
        if: always()
        run: |
          {
            echo "## ECR Chart Publish"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Chart | \`${CHART_NAME}\` |"
            echo "| Version | \`${{ steps.version.outputs.chart_version }}\` |"
            echo "| Already published | \`${{ steps.idempotency.outputs.exists }}\` |"
            echo "| Pushed | \`${{ steps.push.outputs.published || 'false' }}\` |"
            if [ -n "${{ steps.push.outputs.digest }}" ]; then
              ver="${{ steps.version.outputs.chart_version }}"
              uri="oci://${{ needs.aws-auth.outputs.registry }}/${CHART_REPO}:${ver}"
              echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
              echo "| OCI URL | \`${uri}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

