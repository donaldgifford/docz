---
# $schema=https://www.schemastore.org/github-action.json
name: License Check

on:
  push:
    branches: [main]
  # go-licenses reads the module graph, which only a go.mod or go.sum change
  # can alter. Every push to main still runs it.
  pull_request:
    branches: [main]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '.github/licenses-csv.tpl'
      - '.github/workflows/license-check.yml'

permissions:
  contents: read

jobs:
  license-check:
    name: Check Dependency Licenses
    # go-licenses loads every package, so it fails with the Go build on the
    # one PR carrying the `graft` label (DESIGN-0016 OQ 6), like the Go jobs
    # in ci.yml.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'graft') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      # segmentio/asm is MIT No Attribution, which go-licenses cannot classify;
      # the ignore mirrors docz.just's license_ignore.
      - name: Check licenses
        run: go-licenses check ./... --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 --ignore=github.com/segmentio/asm

      - name: Generate license report
        if: always()
        run: go-licenses report ./... --template=.github/licenses-csv.tpl --ignore=github.com/segmentio/asm > licenses.csv

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: licenses.csv
