---
# yaml-language-server: $schema=https://json.schemastore.org/codeql-config.json
# CodeQL configuration (codeql.yml). Every ignored path carries its reason.
name: docz CodeQL config

paths-ignore:
  # A static design prototype from docz-site's DESIGN-0001, built from
  # hard-coded data and never served or bundled. CodeQL flags its ad-hoc
  # innerHTML templating (js/incomplete-multi-character-sanitization).
  - ui/mockup.html
  # Generated by `msw init` ("Please do NOT modify this file") and loaded
  # only by the MSW dev and preview builds. Its message handler is MSW's
  # own (js/missing-origin-check); editing it would be undone on upgrade.
  - ui/public/mockServiceWorker.js
