docs_dir: docs

types:
  rfc:
    enabled: true
    dir: rfc
    template: ""
    id_prefix: "RFC"
    id_width: 4
    statuses:
      - Draft
      - Proposed
      - Accepted
      - Rejected
      - Superseded
    status_field: "status"

  adr:
    enabled: true
    dir: adr
    template: ""
    id_prefix: "ADR"
    id_width: 4
    statuses:
      - Proposed
      - Accepted
      - Deprecated
      - Superseded
    status_field: "status"

  design:
    enabled: true
    dir: design
    template: ""
    id_prefix: "DESIGN"
    id_width: 4
    statuses:
      - Draft
      - In Review
      - Approved
      - Implemented
      - Abandoned
    status_field: "status"

  impl:
    enabled: true
    dir: impl
    template: ""
    id_prefix: "IMPL"
    id_width: 4
    statuses:
      - Draft
      - In Progress
      - Completed
      - Paused
      - Cancelled
    status_field: "status"

  investigation:
    enabled: true
    dir: investigation
    template: ""
    id_prefix: "INV"
    id_width: 4
    statuses:
      - Open
      - In Progress
      - Concluded
      - Inconclusive
      - Abandoned
    status_field: "status"

  # Ships disabled (DESIGN-0019); the short block takes every other field
  # from the built-in defaults.
  runbook:
    enabled: true

index:
  auto_update: true
  preserve_header: true

author:
  from_git: true
  default: ""

wiki:
  auto_update: true
  mkdocs_path: mkdocs.yml
  markdown_extensions:
    # Mermaid diagrams in the design docs are fenced blocks; without
    # superfences the published site renders them as literal code.
    - pymdownx.superfences
  exclude:
    - templates
    - examples
    - archive # docz-api's records (IMPL-0019); keep in step with api.exclude

api:
  enabled: true # publish non-docz markdown under docs_dir as docz-api pages
  exclude:
    - examples # mirrors the wiki exclusion
    - archive # docz-api's records (IMPL-0019); keep in step with wiki.exclude
  additional_docs:
    - CONTRIBUTING.md
    - DEVELOPMENT.md
sync:
  confluence:
    enabled: true # docz export confluence (IMPL-0023); credentials come from the environment
    site: https://dgifford06.atlassian.net
    space: DOCZ
    layout: folder # a docz folder at the top of DOCZ (DESIGN-0021); no parent
    api_pages: true # the api: landing page and additional docs ride along
    exclude:
      - examples # in step with api.exclude
      - archive
